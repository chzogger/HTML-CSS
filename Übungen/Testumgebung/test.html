<!DOCTYPE html>
<html lang="de-CH">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-Boxes</title>

    <style>
        html {

            font-size: 16px;
        }

        body>div:nth-of-type(2) {
            width: 11em;
            height: 8em;
            background-color: limegreen;
            padding: 1em 8px 0.5rem 0.2em;
            border: 0.2rem solid blue;
            box-sizing: content-box;
            margin-top: 1.5em;



        }

        body div:nth-child(1) {
            width: 10em;
            height: 8em;
            background-color: cyan;
            box-sizing: border-box;
            padding: 0.5rem 3em;
            border: 4px dashed tomato;
            margin-bottom: 4em;




        }

        div+div {
            border-bottom-width: 1.2em !important;
        }
    </style>

</head>

<div>Box 1</div>
<div>Box 2</div>
</body>

</html>
